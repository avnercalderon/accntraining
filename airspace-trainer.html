<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>תמונת מרחב — ACC צפון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&family=B612+Mono:wght@400;700&family=B612:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090b; --panel:#0e1216; --panel2:#141a20; --border:#232c33;
  --text:#d7e0e6; --dim:#7d8b94; --accent:#57c8a0; --accent2:#57c8a0;
  --coast:#33413d; --fir:#5a6c63; --area:#a86bc9; --areaFill:rgba(168,107,201,.07);
  --route:#4f9aa6; --star:#c99a4f; --pt:#c9d4da; --airport:#8fb3c4; --navaid:#d8b46a;
  --label:#aebcc4; --search:#0e1216; --shadow:rgba(0,0,0,.5);
}
[data-theme="modern"]{
  --bg:#101722; --panel:#151e2c; --panel2:#1b2637; --border:#2a3a52;
  --text:#e2e9f4; --dim:#8494ab; --accent:#4cc3ff;
  --coast:#31425c; --fir:#5f7392; --area:#c07ff2; --areaFill:rgba(192,127,242,.08);
  --route:#4fb3c9; --star:#e0a95a; --pt:#dbe4f0; --airport:#9ec4e8; --navaid:#e8c47a;
  --label:#b8c6da;
}
[data-theme="light"]{
  --bg:#eef1f0; --panel:#ffffff; --panel2:#f2f5f4; --border:#d3dcd9;
  --text:#1d2a27; --dim:#5f7370; --accent:#0f7a5c;
  --coast:#8aa199; --fir:#6d8479; --area:#7a3f8f; --areaFill:rgba(122,63,143,.06);
  --route:#20707f; --star:#a06b1e; --pt:#33443f; --airport:#2a6187; --navaid:#8a651a;
  --label:#41524d; --shadow:rgba(60,80,75,.25);
}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{height:100%;overflow:hidden;font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);-webkit-overflow-scrolling:touch}
#map{position:absolute;inset:0;touch-action:none;cursor:grab}
#map.drag{cursor:grabbing !important}

/* ---- top bar ---- */
#topbar{position:absolute;top:12px;right:12px;left:12px;display:flex;gap:10px;align-items:flex-start;pointer-events:none;z-index:20}
.brand{pointer-events:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 14px;box-shadow:0 4px 18px var(--shadow)}
.brand h1{font-size:15px;font-weight:700;letter-spacing:.3px}
.brand small{display:block;font-size:11px;color:var(--dim);font-weight:400}
#searchwrap{pointer-events:auto;position:relative;flex:0 1 260px}
#search{width:100%;min-height:44px;background:var(--panel);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:0 14px;font-family:'B612 Mono',monospace;font-size:13px;letter-spacing:1px;box-shadow:0 4px 18px var(--shadow);direction:ltr;text-align:left}
#search::placeholder{font-family:'Heebo';letter-spacing:0;direction:rtl}
#search:focus{outline:2px solid var(--accent);outline-offset:-1px}
#hits{position:absolute;top:48px;left:0;right:0;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:none;max-height:220px;overflow-y:auto}
#hits div{padding:10px 14px;font-family:'B612 Mono',monospace;font-size:12.5px;direction:ltr;text-align:left;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px}
#hits div span{font-family:'Heebo';color:var(--dim);font-size:11px}
#hits div:hover,#hits div.sel{background:var(--panel2);color:var(--accent)}
#themes{pointer-events:auto;margin-inline-start:auto;display:flex;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px 12px;box-shadow:0 4px 18px var(--shadow);align-items:center}
.tdot{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);cursor:pointer;position:relative}
.tdot.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.tdot[data-t="atmas"]{background:radial-gradient(circle at 35% 35%,#20302a,#05070a)}
.tdot[data-t="modern"]{background:radial-gradient(circle at 35% 35%,#3d5a86,#101722)}
.tdot[data-t="light"]{background:radial-gradient(circle at 35% 35%,#ffffff,#c9d6d1)}

/* ---- panel ---- */
#panel{position:absolute;top:76px;right:12px;bottom:44px;width:308px;background:var(--panel);border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;box-shadow:0 8px 30px var(--shadow);z-index:15;overflow:hidden}
#panelhead{display:none}
#panelscroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 0 14px;flex:1}
.sec{border-bottom:1px solid var(--border)}
.sec:last-child{border-bottom:none}
.sechead{display:flex;align-items:center;gap:8px;padding:12px 16px;cursor:pointer;user-select:none;min-height:44px}
.sechead h2{font-size:13.5px;font-weight:700;flex:1}
.sechead .cnt{font-size:11px;color:var(--dim);font-family:'B612 Mono',monospace}
.sechead .chev{transition:transform .18s;color:var(--dim);font-size:11px}
.sec.open .chev{transform:rotate(90deg)}
.secbody{display:none;padding:2px 10px 12px}
.sec.open .secbody{display:block}
.row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;min-height:44px}
.row:hover{background:var(--panel2)}
.row label{flex:1;font-size:13px;cursor:pointer;display:flex;align-items:baseline;gap:8px;min-width:0}
.row .en{font-family:'B612 Mono',monospace;font-size:12px;direction:ltr;unicode-bidi:isolate;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .alt{font-family:'B612 Mono',monospace;font-size:10.5px;color:var(--dim);direction:ltr;white-space:nowrap}
.row .num{font-family:'B612 Mono',monospace;font-size:11px;color:var(--accent);width:16px;text-align:center;flex:none}
.sw{position:relative;width:36px;height:20px;flex:none}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;background:var(--border);border-radius:12px;transition:.15s;pointer-events:none}
.sw i::after{content:'';position:absolute;top:3px;right:3px;width:14px;height:14px;border-radius:50%;background:var(--dim);transition:.15s}
.sw input:checked + i{background:color-mix(in srgb,var(--accent) 40%,var(--panel2))}
.sw input:checked + i::after{transform:translateX(-16px);background:var(--accent)}
.sw input:focus-visible + i{outline:2px solid var(--accent);outline-offset:2px}
.grouphead{display:flex;align-items:center;gap:8px;padding:6px 8px;min-height:44px}
.grouphead b{font-size:12.5px;flex:1}
.grouphead .exp{background:none;border:none;color:var(--dim);cursor:pointer;font-size:11px;font-family:'Heebo';padding:6px;min-height:32px}
.sub{display:none;padding-inline-start:12px}
.sub.open{display:block}
.sub .row{min-height:38px;padding:4px 8px}
.minibtns{display:flex;gap:8px;padding:4px 8px 8px}
.minibtns button{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--dim);border-radius:8px;font-family:'Heebo';font-size:11.5px;padding:7px;cursor:pointer;min-height:34px}
.minibtns button:hover{color:var(--text);border-color:var(--accent)}
.seg3{display:flex;gap:5px}
.seg3 button{background:var(--panel2);border:1px solid var(--border);color:var(--dim);border-radius:8px;font-family:'Heebo';font-size:11.5px;padding:6px 10px;cursor:pointer;min-height:34px}
.seg3 button.on{color:var(--accent);border-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;padding:8px 8px 2px;font-size:11px;color:var(--dim)}
.legend span{display:flex;align-items:center;gap:6px}
.legend canvas{width:16px;height:16px}

/* ---- quiz ---- */
#quizbtn{pointer-events:auto;min-height:44px;background:var(--panel);border:1px solid var(--accent);color:var(--accent);border-radius:10px;padding:0 14px;font-family:'Heebo';font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 4px 18px var(--shadow)}
#quizbtn:hover{background:var(--panel2)}
#quizpanel{position:absolute;top:76px;right:12px;width:308px;max-height:calc(100% - 120px);background:var(--panel);border:1px solid var(--accent);border-radius:14px;display:none;flex-direction:column;box-shadow:0 8px 30px var(--shadow);z-index:16;overflow:hidden}
#quizpanel.open{display:flex}
#quizhead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
#quizhead b{font-size:14px}
#quizclose{background:none;border:none;color:var(--dim);font-size:16px;cursor:pointer;min-width:44px;min-height:32px}
#quizbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 16px}
.qsec{font-size:12px;color:var(--dim);margin:10px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:20px;padding:7px 12px;font-size:12.5px;cursor:pointer;min-height:34px;font-family:'Heebo'}
.chip.on{border-color:var(--accent);color:var(--accent)}
.chip .n{font-family:'B612 Mono',monospace;font-size:10px;color:var(--dim);margin-inline-start:4px}
.qbig{background:var(--accent);color:var(--bg);border:none;border-radius:10px;padding:12px;font-family:'Heebo';font-weight:700;font-size:14px;width:100%;cursor:pointer;min-height:46px;margin-top:14px}
.qbig:disabled{opacity:.4;cursor:default}
.qname{font-family:'B612 Mono',monospace;font-size:34px;font-weight:700;text-align:center;letter-spacing:2px;direction:ltr;margin:8px 0 4px;color:var(--text)}
.qhint{text-align:center;color:var(--dim);font-size:12px}
.qprog{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);font-family:'B612 Mono',monospace;direction:ltr}
.qbar{height:4px;background:var(--border);border-radius:2px;margin:6px 0 10px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--accent)}
.qres{text-align:center;margin:10px 0}
.qres .d{font-family:'B612 Mono',monospace;font-size:22px;font-weight:700;direction:ltr}
.qres .s{font-size:13px;color:var(--dim)}
.qscore{font-family:'B612 Mono',monospace;font-size:44px;font-weight:700;text-align:center;color:var(--accent);direction:ltr}
.qlist{list-style:none;margin-top:10px;max-height:240px;overflow-y:auto}
.qlist li{display:flex;justify-content:space-between;font-family:'B612 Mono',monospace;font-size:12px;padding:5px 4px;border-bottom:1px solid var(--border);direction:ltr}
.qlist li.bad{color:#e0584f}
.qsmall{display:flex;gap:8px;margin-top:10px}
.qsmall button{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;font-family:'Heebo';font-size:12.5px;padding:9px;cursor:pointer;min-height:40px}
@media (max-width:600px){
  #quizbtn{order:2;padding:0 10px;font-size:12px}
  #quizpanel{top:auto;right:0;left:0;bottom:0;width:100%;max-height:52%;border-radius:16px 16px 0 0}
  .qname{font-size:28px}
}

/* ---- footer / zoom ---- */
#zoomer{position:absolute;bottom:44px;left:12px;display:flex;flex-direction:column;gap:8px;z-index:15}
#zoomer button{width:44px;height:44px;border-radius:10px;background:var(--panel);border:1px solid var(--border);color:var(--text);font-size:20px;cursor:pointer;box-shadow:0 4px 14px var(--shadow)}
#zoomer button:hover{border-color:var(--accent);color:var(--accent)}
#foot{position:absolute;bottom:0;left:0;right:0;padding:6px 14px;font-size:10.5px;color:var(--dim);display:flex;justify-content:space-between;gap:10px;background:linear-gradient(to top,var(--bg),transparent);z-index:14;pointer-events:none}
#coords{font-family:'B612 Mono',monospace;direction:ltr}

/* ---- mobile ---- */
#paneltab{display:none}
@media (max-width:600px){
  #topbar{flex-wrap:wrap}
  .brand h1{font-size:13px}
  .brand small{font-size:10px}
  #searchwrap{order:3;flex:1 1 100%}
  #panel{top:auto;right:0;left:0;bottom:0;width:100%;border-radius:16px 16px 0 0;max-height:52%;transform:translateY(calc(100% - 46px));transition:transform .25s ease}
  #panel.open{transform:translateY(0)}
  #panelhead{display:flex;align-items:center;justify-content:center;padding:12px;cursor:pointer;min-height:46px;flex:none}
  #panelhead::before{content:'';width:44px;height:5px;border-radius:3px;background:var(--border)}
  #panelhead b{position:absolute;font-size:12px;color:var(--dim);margin-top:18px}
  #zoomer{bottom:auto;top:130px}
  #foot{display:none}
  .brand,#search,#themes{box-shadow:0 2px 10px var(--shadow)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-theme="atmas">
<canvas id="map"></canvas>

<div id="topbar">
  <div class="brand"><h1>תמונת מרחב · ACC צפון</h1><small>כלי היכרות למרחב האווירי · מחלקת הדרכה</small></div>
  <div id="searchwrap">
    <input id="search" type="text" placeholder="חיפוש נקודה…" autocomplete="off" spellcheck="false">
    <div id="hits"></div>
  </div>
  <button id="quizbtn" title="בחן את עצמך">בחן את עצמך</button>
  <div id="themes" role="group" aria-label="ערכת צבעים">
    <button class="tdot on" data-t="atmas" title="ATMAS" aria-label="ערכת ATMAS"></button>
    <button class="tdot" data-t="modern" title="מודרני" aria-label="ערכה כהה מודרנית"></button>
    <button class="tdot" data-t="light" title="בהיר" aria-label="ערכה בהירה"></button>
  </div>
</div>

<div id="panel">
  <div id="panelhead"><b>שכבות · v5.5</b></div>
  <div id="panelscroll">

    <div class="sec open" id="sec-areas">
      <div class="sechead"><h2>אזורים</h2><span class="cnt" id="areascnt"></span><span class="chev">◀</span></div>
      <div class="secbody">
        <div class="minibtns"><button id="areas-all">הדלק הכל</button><button id="areas-none">כבה הכל</button><button id="areas-default">מצב ייצוא</button></div>
        <div id="arealist"></div>
      </div>
    </div>

    <div class="sec open" id="sec-points">
      <div class="sechead"><h2>נקודות</h2><span class="cnt" id="ptscnt"></span><span class="chev">◀</span></div>
      <div class="secbody">
        <div id="ptcats"></div>
        <div class="row"><label for="tg-bg">נקודות BG <span class="alt">BG123/304/305</span></label><span class="sw"><input type="checkbox" id="tg-bg"><i></i></span></div>
        <div class="row"><label for="tg-ptlabels">תוויות נקודות</label><span class="sw"><input type="checkbox" id="tg-ptlabels" checked><i></i></span></div>
        <div class="row"><label>גודל שמות</label>
          <span class="seg3" role="group" aria-label="גודל פונט">
            <button data-sz="0" class="on">רגיל</button><button data-sz="1">גדול</button><button data-sz="2">ענק</button>
          </span></div>
        <div class="row"><label for="tg-hid">נקודות מוסתרות <span class="alt">14</span></label><span class="sw"><input type="checkbox" id="tg-hid"><i></i></span></div>
        <div class="minibtns"><button id="pt-restore">החזר תוויות שהוסתרו</button></div>
      </div>
    </div>

    <div class="sec" id="sec-routes">
      <div class="sechead"><h2>נתיבי ATS</h2><span class="cnt" id="rtcnt"></span><span class="chev">◀</span></div>
      <div class="secbody" id="routebody"></div>
    </div>

    <div class="sec" id="sec-maps">
      <div class="sechead"><h2>שכבות מפה</h2><span class="cnt" id="mapscnt"></span><span class="chev">◀</span></div>
      <div class="secbody">
        <div class="minibtns"><button id="maps-none">כבה הכל</button></div>
        <div id="maplist"></div>
      </div>
    </div>

    <div class="sec" id="sec-base">
      <div class="sechead"><h2>רקע ותצוגה</h2><span class="chev">◀</span></div>
      <div class="secbody">
        <div class="row"><label for="tg-coast">קו חוף, אגמים וגבולות</label><span class="sw"><input type="checkbox" id="tg-coast" checked><i></i></span></div>
        <div class="row"><label for="tg-fir">גבול FIR</label><span class="sw"><input type="checkbox" id="tg-fir" checked><i></i></span></div>
        <div class="row"><label for="tg-fir2">FIR ביירות</label><span class="sw"><input type="checkbox" id="tg-fir2" checked><i></i></span></div>
        <div class="row"><label for="tg-links">קווי חיבור (GATE LINKS)</label><span class="sw"><input type="checkbox" id="tg-links" checked><i></i></span></div>
        <div class="row"><label for="tg-fill">מילוי שקוף לאזורים</label><span class="sw"><input type="checkbox" id="tg-fill" checked><i></i></span></div>
        <div class="legend" id="legend"></div>
      </div>
    </div>

  </div>
</div>

<div id="quizpanel">
  <div id="quizhead"><b>בחן את עצמך</b><button id="quizclose" aria-label="סגור">✕</button></div>
  <div id="quizbody"></div>
</div>

<div id="zoomer">
  <button id="zin" aria-label="הגדלה">+</button>
  <button id="zout" aria-label="הקטנה">−</button>
  <button id="zfit" aria-label="מרכוז" style="font-size:14px">⌂</button>
</div>

<div id="foot"><span>לצרכי הדרכה בלבד — לא לשימוש מבצעי · הגבהים ברגל (מאות) · v5.5</span><span id="coords"></span></div>

  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },

const cv = document.getElementById('map');
const ctx = cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.direction='ltr';
  draw();
}
window.addEventListener('resize', resize);

const COSLAT = Math.cos(31.6*Math.PI/180);
function px(lon,lat){
  return [ W/2 + (lon - S.center.lon)*S.scale*COSLAT,
           H/2 - (lat - S.center.lat)*S.scale ];
}
function invpx(x,y){
  return { lon: S.center.lon + (x - W/2)/(S.scale*COSLAT),
           lat: S.center.lat - (y - H/2)/S.scale };
}

function polyPath(pts){
  ctx.beginPath();
  pts.forEach((c,i)=>{ const [x,y]=px(c[0],c[1]); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
}
function centroid(pts){
  let sx=0,sy=0; pts.forEach(c=>{sx+=c[0];sy+=c[1];});
  return [sx/pts.length, sy/pts.length];
}
function haloText(txt,x,y,font,color,align='left'){
  ctx.save();
  ctx.font=font; ctx.textAlign=align; ctx.textBaseline='middle';
  ctx.lineWidth=2.2; ctx.lineJoin='round'; ctx.strokeStyle=P().halo; ctx.setLineDash([]);
  ctx.strokeText(txt,x,y);
  ctx.fillStyle=color; ctx.fillText(txt,x,y);
  ctx.restore();
}
function drawSymbol(p){

  ctx.lineWidth=1.1;
  if(p.c==='compulsory'){
    ctx.fillStyle=pal.pt; ctx.beginPath();
    ctx.moveTo(x,y-3.4); ctx.lineTo(x+3,y+2.4); ctx.lineTo(x-3,y+2.4); ctx.closePath(); ctx.fill();
  } else if(p.c==='onrequest'){
    ctx.strokeStyle=pal.pt; ctx.beginPath();
    ctx.moveTo(x,y-3.4); ctx.lineTo(x+3,y+2.4); ctx.lineTo(x-3,y+2.4); ctx.closePath(); ctx.stroke();
  } else if(p.c==='navaid'){
    ctx.strokeStyle=pal.navaid; ctx.beginPath();
    for(let i=0;i<6;i++){ const a=Math.PI/3*i - Math.PI/6, r=4;
      const xx=x+r*Math.cos(a), yy=y+r*Math.sin(a); i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); }
    ctx.closePath(); ctx.stroke();
    ctx.fillStyle=pal.navaid; ctx.beginPath(); ctx.arc(x,y,1.1,0,7); ctx.fill();
  } else if(p.c==='airport'){
    ctx.strokeStyle=pal.airport; ctx.beginPath(); ctx.arc(x,y,3.4,0,7); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x-5,y); ctx.lineTo(x-3.4,y); ctx.moveTo(x+3.4,y); ctx.lineTo(x+5,y);
    ctx.moveTo(x,y-5); ctx.lineTo(x,y-3.4); ctx.moveTo(x,y+3.4); ctx.lineTo(x,y+5);
    ctx.stroke();
  } else {
    ctx.strokeStyle=pal.ptlabel; ctx.strokeRect(x-2.2,y-2.2,4.4,4.4);
  }
}
function inView(x,y,m=60){ return x>-m && x<W+m && y>-m && y<H+m; }

function draw(){
  const pal=P();
  ctx.clearRect(0,0,W,H);

  /* basemap */
  if(S.coast){
    ctx.strokeStyle=pal.coast; ctx.lineWidth=1; ctx.setLineDash([]);
    DATA.basemap.coast.forEach(seg=>{ polyPath(seg); ctx.stroke(); });
    DATA.basemap.lakes.forEach(seg=>{ polyPath(seg); ctx.closePath(); ctx.stroke(); });
    if(DATA.basemap.borders){
      ctx.setLineDash([5,3]);
      DATA.basemap.borders.forEach(seg=>{ polyPath(seg); ctx.stroke(); });
      ctx.setLineDash([]);
    }
  }
  if(S.fir && DATA.fir){
    ctx.strokeStyle=pal.fir; ctx.lineWidth=1.6; ctx.setLineDash([10,4,2,4]);
    polyPath(DATA.fir); ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);
  }
  if(S.fir2 && DATA.fir2){
    ctx.strokeStyle=pal.fir; ctx.lineWidth=1.3; ctx.setLineDash([10,4,2,4]);
    polyPath(DATA.fir2); ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);
    const [bx,by]=px(35.76,33.85);
    if(inView(bx,by)) haloText('BEIRUT FIR', bx, by, '700 9px "B612 Mono",monospace', pal.fir, 'center');
  }

  /* map layers (MapTable) */
  DATA.maps.forEach(m=>{
    if(!S.mapsOn[m.n]) return;
    ctx.strokeStyle = m.col==='route' ? pal.route : m.col==='appr' ? pal.appr : pal.map;
    ctx.lineWidth = m.col==='route' ? 1.6 : m.col==='appr' ? 1.4 : 1.2;
    m.subs.forEach(s=>{
      ctx.setLineDash(DASH[s.lt]||[]);
      if(s.k==='poly'){ polyPath(s.p); ctx.closePath(); ctx.stroke(); }
      else if(s.k==='line'){ polyPath(s.p); ctx.stroke(); }
      else if(s.k==='arc'){
        const [clon,clat]=s.c;
        let a0=s.a0, a1=s.a1; if(a1<a0) a1+=360;
        ctx.beginPath();
        const mPerDegLat=111320;
        for(let a=a0;a<=a1;a+=2){
          const th=a*Math.PI/180;
          const lat=clat + (s.r*Math.cos(th))/mPerDegLat;
          const lon=clon + (s.r*Math.sin(th))/(mPerDegLat*Math.cos(lat*Math.PI/180));
          const [x,y]=px(lon,lat);
          a===a0?ctx.moveTo(x,y):ctx.lineTo(x,y);
        }
        ctx.stroke();
      }
      else if(s.k==='pt'){
        const [x,y]=px(s.p[0][0],s.p[0][1]);
        if(inView(x,y) && !(Q && Q.phase!=='setup')) haloText(s.n, x, y, '700 8px "B612 Mono",monospace', pal.mapLabel, 'center');
      }
      else if(s.k==='house'){
        const [x,y]=px(s.p[0][0],s.p[0][1]);
        if(inView(x,y)){
          const c = m.col==='appr' ? pal.appr : pal.map;
          ctx.save(); ctx.strokeStyle=c; ctx.lineWidth=1.3; ctx.setLineDash([]);
          ctx.beginPath();                       /* walls */
          ctx.rect(x-4,y-1,8,5);
          ctx.moveTo(x-5.5,y-1); ctx.lineTo(x,y-6); ctx.lineTo(x+5.5,y-1);  /* roof */
          ctx.moveTo(x-1,y+4); ctx.lineTo(x-1,y+1); ctx.lineTo(x+1,y+1); ctx.lineTo(x+1,y+4); /* door */
          ctx.stroke(); ctx.restore();
          if(s.lbl) haloText(s.n, x+8, y-4, '700 7px "B612 Mono",monospace', c);
        }
      }
      else if(s.k==='wpt'){
        const [x,y]=px(s.p[0][0],s.p[0][1]);
        if(inView(x,y)){
          const c = m.col==='appr' ? pal.appr : pal.map;
          ctx.save(); ctx.strokeStyle=c; ctx.lineWidth=1.2; ctx.setLineDash([]);
          ctx.beginPath();
          for(let i=0;i<8;i++){ const a=Math.PI/4*i, r=(i%2? 1.6:4.6);
            const xx=x+r*Math.sin(a), yy=y-r*Math.cos(a); i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); }
          ctx.closePath(); ctx.stroke(); ctx.restore();
          if(s.lbl && !(Q && Q.phase!=='setup')) haloText(s.n, x+6, y-5, '700 7px "B612 Mono",monospace', c);
        }
      }
      ctx.setLineDash([]);
    });
  });

  /* forbidden areas */
  DATA.areas.forEach(a=>{
    if(!S.areasOn[a.n]) return;
    a.subs.forEach(s=>{
      polyPath(s.p); ctx.closePath();
      if(S.areaFill){ ctx.fillStyle=pal.areaFill; ctx.fill(); }
      ctx.strokeStyle=pal.area; ctx.lineWidth=1.5;
      ctx.setLineDash(DASH[s.lt]||[]); ctx.stroke(); ctx.setLineDash([]);
    });
  });

  /* routes */
  DATA.routes.forEach(r=>{
    if(!S.routeOn[r.n]) return;
    const pts = r.w.map(n=>PT[n]).filter(Boolean);
    if(pts.length<2) return;
    const col = r.t==='STAR' ? pal.star : pal.route;
    ctx.strokeStyle=col; ctx.lineWidth=1.6;
    ctx.setLineDash(r.t==='STAR'?[8,5]:[]);
    ctx.beginPath();
    pts.forEach((p,i)=>{ const [x,y]=px(p.lon,p.lat); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.stroke(); ctx.setLineDash([]);
    let mx,my;
    if(r.lp){ [mx,my]=px(r.lp[0],r.lp[1]); }
    else { const mid=pts[Math.floor(pts.length/2)]; [mx,my]=px(mid.lon,mid.lat); }
    if(inView(mx,my)) haloText(r.n, mx+8, my-8, '700 10.5px "B612 Mono",monospace', col);
  });

  /* points — labels placed with collision avoidance (radar-style declutter) */
  const inQuiz = Q && (Q.phase==='q' || Q.phase==='fb');
  const showLbl = !inQuiz && S.ptLabels && S.scale>=70;
  lblRects = {};
  const placed = [];
  const visible = [];
  if(inQuiz){
    /* quiz: easy level shows the pool's symbols (no names); hard level shows nothing */
    if(Q.level==='easy') Q.pool.forEach(p=>{ const [x,y]=px(p.lon,p.lat); if(inView(x,y)) drawSymbol(p); });
  } else DATA.points.forEach(p=>{
    if(p.g==='del') return;
    if(!S.cats[p.c]) return;
    if(p.g==='bg' && !S.bgOn) return;
    if(p.g==='hid' && !S.hidOn) return;
    const [x,y]=px(p.lon,p.lat);
    if(!inView(x,y)) return;
    drawSymbol(p);
    if(showLbl && !hiddenLbl.has(p.n)) visible.push({p,x,y});
  });
  if(visible.length){
    const prio={airport:0,navaid:1,compulsory:2,onrequest:3,other:4};
    visible.sort((a,b)=>(prio[a.p.c]-prio[b.p.c])||a.p.n.localeCompare(b.p.n));
    const collide=(r)=>placed.some(q=> r[0]<q[0]+q[2]+1 && q[0]<r[0]+r[2]+1 && r[1]<q[1]+q[3]+1 && q[1]<r[1]+r[3]+1 );
    visible.forEach(({p,x,y})=>{
      const strong = p.c==='airport'||p.c==='navaid';
      const SZ=[['6.5px','700 7px',8],['9.5px','700 10px',11],['12.5px','700 13px',14]][S.lblSize];
      const font = (strong?SZ[1]:SZ[0])+' "B612 Mono",monospace';
      ctx.font=font;
      const w=ctx.measureText(p.n).width, h=SZ[2];
      const cands=[
        {x:x+5,  y:y-1,  align:'left',   rect:[x+5,   y-1-h/2, w, h]},
        {x:x-5,  y:y-1,  align:'right',  rect:[x-5-w, y-1-h/2, w, h]},
        {x:x,    y:y-8,  align:'center', rect:[x-w/2, y-8-h/2, w, h]},
        {x:x,    y:y+8,  align:'center', rect:[x-w/2, y+8-h/2, w, h]},
      ];
      const col = p.c==='airport'?P().airport : p.c==='navaid'?P().navaid : P().ptlabel;
      for(const c of cands){
        if(!collide(c.rect)){
          haloText(p.n, c.x, c.y, font, col, c.align);
          placed.push(c.rect);
          lblRects[p.n]=c.rect;
          break;
        }
      }
    });
  }

  /* quiz feedback: click mark, true position, connecting line, distance */
  if(Q && Q.phase==='fb' && Q.last){
    const L=Q.last, pal2=P();
    const [tx,ty]=px(L.p.lon,L.p.lat), [cx,cy]=px(L.clon,L.clat);
    ctx.save(); ctx.setLineDash([]);
    ctx.strokeStyle=pal2.pulse; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(tx,ty); ctx.stroke();
    ctx.strokeStyle='#e0584f'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx-6,cy-6); ctx.lineTo(cx+6,cy+6); ctx.moveTo(cx+6,cy-6); ctx.lineTo(cx-6,cy+6); ctx.stroke();
    ctx.strokeStyle=pal2.pulse; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(tx,ty,9,0,7); ctx.stroke();
    drawSymbol(L.p);
    ctx.restore();
    haloText(L.p.n, tx+13, ty-11, '700 11px "B612 Mono",monospace', pal2.pulse);
    const far = Math.hypot(cx-tx,cy-ty)>70;
    haloText(L.nm.toFixed(1)+' NM', far?(cx+tx)/2:cx, far?(cy+ty)/2+14:cy+16, '700 10px "B612 Mono",monospace', pal2.label, 'center');
  }

  /* search pulse */
  if(pulse){
    const dt=(performance.now()-pulse.t0)/1000;
    if(dt<2.4){
      const [x,y]=px(pulse.lon,pulse.lat);
      const r=8+((dt*1.2)%1)*26;
      ctx.strokeStyle=P().pulse; ctx.lineWidth=2;
      ctx.globalAlpha=1-((dt*1.2)%1);
      ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.stroke();
      ctx.globalAlpha=1;
      requestAnimationFrame(draw);
    } else pulse=null;
  }
}

/* ================= interaction (Pointer Events — unified for mouse/touch/pen) ================= */
function hitPoint(x,y,r=12){
  let best=null, bd=r;
  const lblOn = S.ptLabels && S.scale>=70;
  DATA.points.forEach(p=>{
    if(p.g==='del') return;
    if(!S.cats[p.c]) return;
    if(p.g==='bg' && !S.bgOn) return;
    if(p.g==='hid' && !S.hidOn) return;
    const [sx,sy]=px(p.lon,p.lat);
    const d=Math.hypot(sx-x,sy-y);
    if(d<bd){ bd=d; best=p; return; }
    if(lblOn && !hiddenLbl.has(p.n)){
      const lr=lblRects[p.n];
      if(lr && x>=lr[0]-2 && x<=lr[0]+lr[2]+2 && y>=lr[1]-2 && y<=lr[1]+lr[3]+2){ bd=0; best=p; }
    }
  });
  return best;
}
function toggleLbl(p){
  if(hiddenLbl.has(p.n)) hiddenLbl.delete(p.n); else hiddenLbl.add(p.n);
  draw();
}
const ptrs = new Map(); // active pointers on canvas
let gesture = null;     // {mode:'pan'|'pinch', startX,startY, t0, moved, lastX,lastY, lastDist}
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){
    gesture={mode:'pan',startX:e.clientX,startY:e.clientY,t0:performance.now(),moved:0,lastX:e.clientX,lastY:e.clientY};
    cv.classList.add('drag');
  } else if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    gesture={mode:'pinch',lastDist:Math.hypot(a.x-b.x,a.y-b.y),moved:99};
  }
});
cv.addEventListener('pointermove',e=>{
  const el=document.getElementById('coords');
  if(el){ const c=invpx(e.clientX,e.clientY); el.textContent=c.lat.toFixed(3)+'N  '+c.lon.toFixed(3)+'E'; }
  if(!ptrs.has(e.pointerId)){
    if(e.pointerType==='mouse') cv.style.cursor = (Q && Q.phase==='q') ? 'crosshair' : (hitPoint(e.clientX,e.clientY) ? 'pointer' : 'grab');
    return;
  }
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(!gesture) return;
  if(gesture.mode==='pan' && ptrs.size===1){
    S.center.lon -= (e.clientX-gesture.lastX)/(S.scale*COSLAT);
    S.center.lat += (e.clientY-gesture.lastY)/S.scale;
    gesture.moved=Math.max(gesture.moved,Math.hypot(e.clientX-gesture.startX,e.clientY-gesture.startY));
    gesture.lastX=e.clientX; gesture.lastY=e.clientY;
    draw();
  } else if(gesture.mode==='pinch' && ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(gesture.lastDist>0) zoomAt((a.x+b.x)/2,(a.y+b.y)/2, d/gesture.lastDist);
    gesture.lastDist=d;
  }
});
function endPointer(e){
  const wasTap = gesture && gesture.mode==='pan' && ptrs.size===1 &&
                 gesture.moved<6 && performance.now()-gesture.t0<600;
  const tapX=e.clientX, tapY=e.clientY;
  ptrs.delete(e.pointerId);
  if(ptrs.size===0){
    cv.classList.remove('drag');
    if(wasTap){
      if(Q && Q.phase==='q'){ quizAnswer(tapX,tapY); }
      else { const p=hitPoint(tapX,tapY, e.pointerType==='mouse'?12:20); if(p) toggleLbl(p); }
    }
    gesture=null;
  } else if(ptrs.size===1){
    const [a]=[...ptrs.values()];
    gesture={mode:'pan',startX:a.x,startY:a.y,t0:0,moved:99,lastX:a.x,lastY:a.y};
  }
}
cv.addEventListener('pointerup',endPointer);
cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId); if(ptrs.size===0){gesture=null;cv.classList.remove('drag');}});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  zoomAt(e.clientX,e.clientY, e.deltaY<0?1.15:1/1.15);
},{passive:false});
function zoomAt(x,y,f){
  const before=invpx(x,y);
  S.scale = Math.max(25, Math.min(2200, S.scale*f));
  const after=invpx(x,y);
  S.center.lon += before.lon-after.lon;
  S.center.lat += before.lat-after.lat;
  draw();
}

document.getElementById('zin').onclick=()=>zoomAt(W/2,H/2,1.3);
document.getElementById('zout').onclick=()=>zoomAt(W/2,H/2,1/1.3);
document.getElementById('zfit').onclick=fit;
function fit(){
  const pts=DATA.fir;
  let lonmin=99,lonmax=-99,latmin=99,latmax=-99;
  pts.forEach(c=>{lonmin=Math.min(lonmin,c[0]);lonmax=Math.max(lonmax,c[0]);latmin=Math.min(latmin,c[1]);latmax=Math.max(latmax,c[1]);});
  S.center={lon:(lonmin+lonmax)/2, lat:(latmin+latmax)/2};
  S.scale = Math.min((W-60)/((lonmax-lonmin)*COSLAT), (H-100)/(latmax-latmin));
  draw();
}
window.addEventListener('keydown',e=>{
  if(document.activeElement===search) return;
  if(e.key==='+'||e.key==='=') zoomAt(W/2,H/2,1.3);
  if(e.key==='-') zoomAt(W/2,H/2,1/1.3);
});

function mkSwitch(id,checked,cb){
  const s=document.createElement('span'); s.className='sw';
  s.innerHTML=`<input type="checkbox" id="${id}" ${checked?'checked':''}><i></i>`;
  s.querySelector('input').addEventListener('change',e=>cb(e.target.checked));
  return s;
}

function drawLegend(){

}
function drawSymbolAt(c2,x,y,cat){
  const pal=P(); c2.lineWidth=1.4;
  if(cat==='compulsory'){ c2.fillStyle=pal.pt; c2.beginPath(); c2.moveTo(x,y-5);c2.lineTo(x+4.5,y+3.5);c2.lineTo(x-4.5,y+3.5);c2.closePath();c2.fill(); }
  else if(cat==='onrequest'){ c2.strokeStyle=pal.pt; c2.beginPath(); c2.moveTo(x,y-5);c2.lineTo(x+4.5,y+3.5);c2.lineTo(x-4.5,y+3.5);c2.closePath();c2.stroke(); }
  else if(cat==='navaid'){ c2.strokeStyle=pal.navaid; c2.beginPath(); for(let i=0;i<6;i++){const a=Math.PI/3*i-Math.PI/6,r=5.5;const xx=x+r*Math.cos(a),yy=y+r*Math.sin(a);i?c2.lineTo(xx,yy):c2.moveTo(xx,yy);} c2.closePath(); c2.stroke(); c2.fillStyle=pal.navaid;c2.beginPath();c2.arc(x,y,1.4,0,7);c2.fill(); }
  else if(cat==='airport'){ c2.strokeStyle=pal.airport; c2.beginPath();c2.arc(x,y,4.5,0,7);c2.stroke(); c2.beginPath(); c2.moveTo(x-6.5,y);c2.lineTo(x-4.5,y);c2.moveTo(x+4.5,y);c2.lineTo(x+6.5,y);c2.moveTo(x,y-6.5);c2.lineTo(x,y-4.5);c2.moveTo(x,y+4.5);c2.lineTo(x,y+6.5);c2.stroke(); }
}

/* ================= search ================= */
const search=document.getElementById('search');
const hits=document.getElementById('hits');
const CATHE={compulsory:'דיווח חובה',onrequest:'לפי דרישה',navaid:'VOR',airport:'שדה',other:'נקודה'};
let sel=-1;
function doSearch(){
  if(Q && Q.phase!=='setup'){ hits.style.display='none'; return; }
  const q=search.value.trim().toUpperCase();
  hits.innerHTML=''; sel=-1;
  if(q.length<2){ hits.style.display='none'; return; }
  const found=DATA.points.filter(p=>p.g!=='del' && p.n.toUpperCase().includes(q)).slice(0,8);
  if(!found.length){ hits.style.display='none'; return; }
  found.forEach(p=>{
    const d=document.createElement('div');
    d.innerHTML=`${p.n}<span>${CATHE[p.c]||''}</span>`;
    d.onclick=()=>goTo(p);
    hits.appendChild(d);
  });
  hits.style.display='block';
}
function goTo(p){
  hits.style.display='none'; search.value=p.n; search.blur();
  if(!S.cats[p.c]){ S.cats[p.c]=true; const inp=document.getElementById('cat-'+p.c); if(inp) inp.checked=true; }
  if(p.g==='bg' && !S.bgOn){ S.bgOn=true; const inp=document.getElementById('tg-bg'); if(inp) inp.checked=true; }
  if(p.g==='hid' && !S.hidOn){ S.hidOn=true; const inp=document.getElementById('tg-hid'); if(inp) inp.checked=true; }
  S.center={lon:p.lon,lat:p.lat};
  S.scale=Math.max(S.scale,220);
  pulse={lon:p.lon,lat:p.lat,t0:performance.now()};
  draw();
}
search.addEventListener('input',doSearch);
search.addEventListener('keydown',e=>{
  const items=[...hits.children];
  if(e.key==='ArrowDown'){ sel=Math.min(sel+1,items.length-1); }
  else if(e.key==='ArrowUp'){ sel=Math.max(sel-1,0); }
  else if(e.key==='Enter'){
    const q=search.value.trim().toUpperCase();
    const exact=DATA.points.find(p=>p.g!=='del' && p.n.toUpperCase()===q);
    if(sel>=0 && items[sel]) items[sel].click();
    else if(exact) goTo(exact);
    else if(items[0]) items[0].click();
    return;
  } else if(e.key==='Escape'){ hits.style.display='none'; return; }
  else return;
  items.forEach((it,i)=>it.classList.toggle('sel',i===sel));
});
document.addEventListener('click',e=>{ if(!e.target.closest('#searchwrap')) hits.style.display='none'; });

/* ================= quiz: "בחן את עצמך" ================= */
const QGROUPS=[ {id:'all', he:'בנק הנקודות', f:p=>true} ];
/* quiz bank bounds (training-dept decision): east of TEZAK, west of MUVIN, south of GALIM, north of AMMIT */
const qBox=(()=>{ const g=n=>DATA.points.find(p=>p.n===n);
  const w=g('TEZAK'),e=g('MUVIN'),n=g('GALIM'),s=g('AMMIT');
  return (w&&e&&n&&s)?{lonMin:w.lon,lonMax:e.lon,latMax:n.lat,latMin:s.lat}:null; })();
/* explicitly included regardless of the box (training-dept list) */
const qExtra=new Set(['PIKOG','AZERE','VELOX','VESAR','DESPO','LEDRA','APLON','ZOMBA','SAFTA','BIRES','STEPA','LAKTO',
                      'RALNA','MUVIN','GALIM','KINAR','MOUAB','OSAMA','OJAI','OJAM','OJKA','OJMS','AMMIT','MZD']);
/* explicitly excluded (training-dept list) */
const qOut=new Set(['ALIQA','ANOZA','BAGAG','DONAG','ERREZ','FOLKU','GAFAZ','HDIR','HERZ','HKON','HVTK','HZAHAV','HZUK','IVONA',
                    'KESEM','LAKIF','LEGOH','MAGEL','MOCEV','NATNEW','NPASS','ORPAZ','PIDET','PITAT','RAPIV','SISIM','TOPPU',
                    'BG123','BG304','BG305']);
const qAll = DATA.points.filter(p=>p.g!=='del' && !qOut.has(p.n) && (qExtra.has(p.n) || !qBox ||
  (p.lon>qBox.lonMin && p.lon<qBox.lonMax && p.lat<qBox.latMax && p.lat>qBox.latMin)));
const qPanel=document.getElementById('quizpanel'), qBody=document.getElementById('quizbody');
const qSetup={group:'all', level:'easy', n:10};
const NM=(a,b)=>{ const dlat=(b.lat-a.lat)*60, dlon=(b.lon-a.lon)*60*Math.cos((a.lat+b.lat)/2*Math.PI/180); return Math.hypot(dlat,dlon); };
const qScore=d=> d<=1 ? 100 : Math.max(0, Math.round(100*(10-d)/9));

function quizOpen(){
  Q={phase:'setup'};
  qPanel.classList.add('open'); document.getElementById('panel').style.display='none';
  quizRender(); draw();
}
function quizClose(){
  search.disabled=false; search.placeholder='חיפוש נקודה…';
  Q=null; qPanel.classList.remove('open'); document.getElementById('panel').style.display='';
  cv.style.cursor='grab'; draw();
}
function quizStart(){
  search.value=''; search.disabled=true; search.placeholder='חיפוש כבוי בזמן תרגול';
  const g=QGROUPS.find(g=>g.id===qSetup.group);
  const pool=qAll.filter(g.f);
  if(pool.length<2){ alert('אין מספיק נקודות בקבוצה הזו'); return; }
  const order=[...pool].sort(()=>Math.random()-0.5).slice(0, Math.min(qSetup.n, pool.length));
  Q={phase:'q', level:qSetup.level, pool, order, idx:0, answers:[], last:null};
  /* frame the map on the group */
  let lonmin=99,lonmax=-99,latmin=99,latmax=-99;
  pool.forEach(p=>{lonmin=Math.min(lonmin,p.lon);lonmax=Math.max(lonmax,p.lon);latmin=Math.min(latmin,p.lat);latmax=Math.max(latmax,p.lat);});
  const pad=0.15;
  S.center={lon:(lonmin+lonmax)/2, lat:(latmin+latmax)/2};
  S.scale=Math.max(40,Math.min(900, Math.min((W-(window.innerWidth>600?360:60))/((lonmax-lonmin+pad)*COSLAT), (H-(window.innerWidth>600?120:H*0.55))/(latmax-latmin+pad))));
  quizRender(); draw();
}
function quizAnswer(x,y){
  const c=invpx(x,y), p=Q.order[Q.idx];
  const d=NM({lat:c.lat,lon:c.lon},p), sc=qScore(d);
  Q.last={p,clon:c.lon,clat:c.lat,nm:d,score:sc};
  Q.answers.push({n:p.n,nm:d,score:sc});
  Q.phase='fb'; quizRender(); draw();
}
function quizNext(){
  Q.idx++;
  if(Q.idx>=Q.order.length){ Q.phase='end'; Q.last=null; }
  else { Q.phase='q'; Q.last=null; }
  quizRender(); draw();
}
function quizRender(){
  if(!Q) return;
  if(Q.phase==='setup'){
    qBody.innerHTML=`
      <div class="qsec">בנק הנקודות <span class="n" style="font-family:'B612 Mono',monospace">${qAll.length}</span></div>
      <div class="qsec">רמה</div><div class="chips" id="ql">
        <button class="chip ${qSetup.level==='easy'?'on':''}" data-l="easy">קל · האייקונים נשארים</button>
        <button class="chip ${qSetup.level==='hard'?'on':''}" data-l="hard">קשה · מפה ריקה</button></div>
      <div class="qsec">מספר שאלות</div><div class="chips" id="qn">
        ${[5,10,20].map(n=>`<button class="chip ${qSetup.n===n?'on':''}" data-n="${n}">${n}</button>`).join('')}</div>
      <button class="qbig" id="qstart">התחל</button>
      <div class="qhint" style="margin-top:10px">תקבל שם של נקודה — לחץ על המפה איפה שהיא נמצאת. ניקוד 0–100 לפי המרחק.</div>`;
    qBody.querySelectorAll('#ql .chip').forEach(b=>b.onclick=()=>{qSetup.level=b.dataset.l; quizRender();});
    qBody.querySelectorAll('#qn .chip').forEach(b=>b.onclick=()=>{qSetup.n=+b.dataset.n; quizRender();});
    document.getElementById('qstart').onclick=quizStart;
  }
  else if(Q.phase==='q' || Q.phase==='fb'){
    const p=Q.order[Q.idx], tot=Q.order.length, done=Q.answers.length;
    const sum=Q.answers.reduce((s,a)=>s+a.score,0);
    let res='';
    if(Q.phase==='fb'){
      const L=Q.last;
      res=`<div class="qres"><div class="d">${L.nm.toFixed(1)} NM · ${L.score}</div>
           <div class="s">${L.score>=80?'מצוין':L.score>=50?'קרוב':'רחוק — שים לב איפה היא באמת'}</div></div>
           <button class="qbig" id="qnext">${Q.idx+1>=tot?'סיכום':'הבא'}</button>`;
    } else res=`<div class="qhint" style="margin-top:14px">לחץ על המפה במיקום הנקודה</div>`;
    qBody.innerHTML=`
      <div class="qprog"><span>${Q.idx+1} / ${tot}</span><span>${done?Math.round(sum/done):'–'} avg</span></div>
      <div class="qbar"><i style="width:${Math.round(done/tot*100)}%"></i></div>
      <div class="qname">${p.n}</div>
      <div class="qhint">${Q.level==='easy'?'רמה קלה':'רמה קשה'}</div>
      ${res}`;
    const nb=document.getElementById('qnext'); if(nb) nb.onclick=quizNext;
  }
  else if(Q.phase==='end'){
    const tot=Q.answers.length, sum=Q.answers.reduce((s,a)=>s+a.score,0), avg=Math.round(sum/tot);
    const worst=[...Q.answers].sort((a,b)=>b.nm-a.nm);
    qBody.innerHTML=`
      <div class="qhint">ציון ממוצע</div><div class="qscore">${avg}</div>
      <div class="qhint">${avg>=85?'שולט במרחב 👌':avg>=60?'בסיס טוב — תרגל את הרחוקות':'עוד סבב, זה מתחיל להיכנס'}</div>
      <ul class="qlist">${worst.map(a=>`<li class="${a.score<50?'bad':''}"><span>${a.n}</span><span>${a.nm.toFixed(1)} NM · ${a.score}</span></li>`).join('')}</ul>
      <button class="qbig" id="qagain">סבב נוסף</button>
      <div class="qsmall"><button id="qsetup">שנה הגדרות</button><button id="qexit">חזרה למפה</button></div>`;
    document.getElementById('qagain').onclick=quizStart;
    document.getElementById('qsetup').onclick=()=>{search.disabled=false; search.placeholder='חיפוש נקודה…'; Q={phase:'setup'}; quizRender(); draw();};
    document.getElementById('qexit').onclick=quizClose;
  }
}
document.getElementById('quizbtn').addEventListener('click',()=>{ if(Q) quizClose(); else quizOpen(); });
document.getElementById('quizclose').addEventListener('click',quizClose);
window.addEventListener('keydown',e=>{
  if(Q && Q.phase==='fb' && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); quizNext(); }
});

resize(); fit(); drawLegend();
